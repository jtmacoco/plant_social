version: '3.8'

services:
  plant-social-app:
    build: 
      context: .
      dockerfile: ./app/plant-social-app/Dockerfile
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo dev tools
      - "19006:19006" # Expo web
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=localhost
    stdin_open: true
    tty: true
